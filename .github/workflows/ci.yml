name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test (${{ matrix.os }} - Java ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        java: [ '21', '25' ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Run Build and Test
        run: ./gradlew build check --no-daemon

      - name: Print Dependency & Jar Size Report
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        run: ./gradlew dependencySizeReport jarSizeCheck

      - name: Upload Fat Jar
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        uses: actions/upload-artifact@v4
        with:
          name: nardol-fatjar
          path: build/libs/nardol-*-all.jar
