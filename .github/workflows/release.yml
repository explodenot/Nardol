name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Fat Jar
        run: ./gradlew build check shadowJar --no-daemon

      - name: Compute Checksum
        run: |
          cd build/libs
          sha256sum gpl-*-all.jar > gpl-sha256.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/gpl-*-all.jar
            build/libs/gpl-sha256.txt
