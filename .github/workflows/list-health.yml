name: Targets List Health Check

on:
  schedule:
    - cron: '0 4 * * *' # Every day at 04:00 UTC
  workflow_dispatch:

jobs:
  check-targets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Nardol
        run: ./gradlew shadowJar --no-daemon

      - name: Probe All Targets
        run: |
          java -jar build/libs/nardol-*-all.jar --json --timeout 5000 --samples 2 > results.json || true
          cat results.json | jq '.unreachableRegions, .degradedRegions'
